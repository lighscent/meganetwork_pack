name: Build pack

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACK_NAME: "§5§lMegaNetwork §r§8| §6MMO §aSaison 2.zip"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Zip pack
        run: |
          mkdir -p dist
          zip -r "dist/$PACK_NAME" pack.mcmeta assets -x '.git/*' '.github/*'
          if [ -f pack.png ]; then zip -u "dist/$PACK_NAME" pack.png; fi
          unzip -l "dist/$PACK_NAME"

      - name: Checksum
        id: sha
        run: |
          sha1sum "dist/$PACK_NAME"
          echo "value=$(sha1sum "dist/$PACK_NAME" | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pack-${{ github.run_number }}
          name: MegaNetwork pack - ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.short }})
          body: |
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
            Minecraft 26.3 - pack format 97.1

            `resource-pack-sha1=${{ steps.sha.outputs.value }}`
          files: dist/${{ env.PACK_NAME }}
